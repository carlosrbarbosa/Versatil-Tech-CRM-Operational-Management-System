<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Novo Artigo | Versátil Tech</title>

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/clientes.css">
  <link rel="stylesheet" href="assets/css/conhecimento.css">
  <link rel="icon" type="image/png" href="assets/images/logo-versatil.png">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <a href="dashboard.html" class="sidebar-header">
        <img src="assets/images/logo-versatil.png" alt="Logo Versátil Tech" class="sidebar-logo">
        <span class="sidebar-logo-text">Versátil Tech</span>
      </a>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link"><i class="ph-fill ph-house"></i> <span>Dashboard</span></a>
        <a href="clientes.html" class="nav-link"><i class="ph-fill ph-users"></i> <span>Clientes</span></a>
        <a href="tickets.html" class="nav-link"><i class="ph-fill ph-ticket"></i> <span>Tickets</span></a>
        <a href="usuarios.html" class="nav-link"><i class="ph-fill ph-user-list"></i> <span>Usuários</span></a>
        <a href="conhecimento.html" class="nav-link active"><i class="ph-fill ph-books"></i> <span>Conhecimento</span></a>
      </nav>
    </aside>

    <div class="main-content">
      <header class="navbar">
        <div class="navbar-left">
          <button class="mobile-menu-toggle" id="mobileMenuToggle"><i class="ph-fill ph-list"></i></button>
          <h1 class="navbar-title">Criar Novo Artigo</h1>
        </div>
        <div class="navbar-right">
          <div class="user-profile"><span>[Nome]</span><div class="user-avatar"><span>U</span></div></div>
          <a href="index.html" class="logout-button" title="Sair"><i class="ph-fill ph-sign-out"></i></a>
        </div>
      </header>

      <main class="content-area">
        <div class="page-header" style="justify-content: space-between;">
          <p></p>
          <a href="conhecimento.html" class="btn btn-secondary">
            <i class="ph ph-arrow-left"></i> Voltar para a Base de Conhecimento
          </a>
        </div>

        <div class="form-container card">
          <form id="articleForm">
            <div class="form-group">
              <label for="articleTitle">Título do Artigo</label>
              <input type="text" id="articleTitle" required>
            </div>

            <div class="form-group">
              <label for="articleCategory">Categoria</label>
              <select id="articleCategory" required>
                <option value="sistema">Sistema</option>
                <option value="fiscal">Fiscal</option>
                <option value="hardware">Hardware</option>
                <option value="videos">Vídeos</option>
                <option value="outros">Outros</option>
              </select>
            </div>

            <div class="form-group">
              <label for="videoUrl">Link do Vídeo</label>
              <input type="url" id="videoUrl" placeholder="https://...">
            </div>

            <div class="form-group">
              <label for="articleContent">Conteúdo do Artigo</label>
              <textarea id="articleContent" rows="12" placeholder="Escreva o conteúdo do artigo..."></textarea>
            </div>

            <div class="form-actions">
              <button type="button" class="btn btn-secondary" onclick="window.location.href='conhecimento.html'">Cancelar</button>
              <button type="submit" class="btn btn-primary">Publicar Artigo</button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="assets/js/main.js" defer></script>
  <script src="assets/js/artigo_formulario.js" defer></script>
</body>
</html>
