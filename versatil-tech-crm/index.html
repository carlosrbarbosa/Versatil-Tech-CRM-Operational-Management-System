<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Versátil Tech</title>
    
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="icon" type="image/png" href="assets/images/logo-versatil.png">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

    <main class="login-container">

        <div class="login-card">
            
            <img src="assets/images/logo-versatil.png" alt="Logo Versátil Tech" class="login-logo">
            
            <div id="loginView">
                <h1 class="login-title">Bem-vindo de volta!</h1>
                <p class="login-subtitle">Faça login para acessar o sistema.</p>

                <form id="loginForm">
                    <div class="input-group has-icon">
                        <i class="ph ph-envelope-simple"></i>
                        <input type="email" id="email" name="email" placeholder="Seu email" required>
                    </div>

                    <div class="input-group has-icon">
                        <i class="ph ph-lock-simple"></i>
                        <input type="password" id="senha" name="senha" placeholder="Sua senha" required>
                    </div>

                    <div class="form-extra-options">
                        <div class="remember-me">
                            <input type="checkbox" id="rememberMe">
                            <label for="rememberMe">Lembrar-me</label>
                        </div>
                        <a href="#" id="showRecoveryBtn" class="forgot-password">Esqueceu a senha?</a>
                    </div>

                    <button type="submit" id="loginButton" class="btn-login">Entrar</button>
                    
                    <div id="feedbackMessage" class="feedback" style="margin-top: 15px; font-size: 14px; font-weight: 500;"></div>
                </form>
            </div>

            <div id="recoveryView" style="display: none;">
                <h1 class="login-title">Recuperar Senha</h1>
                <p class="login-subtitle">Digite seu e-mail para receber as instruções.</p>

                <form id="recoveryForm">
                    <div class="input-group has-icon">
                        <i class="ph ph-envelope-simple"></i>
                        <input type="email" id="recoveryEmail" name="recoveryEmail" placeholder="Seu email cadastrado" required>
                    </div>

                    <button type="submit" id="recoveryButton" class="btn-login">Enviar instruções</button>
                    
                    <div id="recoveryFeedbackMessage" class="feedback" style="margin-top: 15px; font-size: 14px; font-weight: 500;"></div>
                    
                    <div style="margin-top: 25px;">
                        <a href="#" id="showLoginBtn" class="forgot-password" style="display: inline-flex; align-items: center; gap: 6px;">
                            <i class="ph ph-arrow-left"></i> Voltar para o login
                        </a>
                    </div>
                </form>
            </div>

        </div>

    </main>

    <footer class="login-footer">
        &copy; 2026 Carlos Rocha Barbosa. Todos os direitos reservados. Projeto Versátil Tech.
    </footer>

    <script src="assets/js/login.js" defer></script>
</body>
</html>
