<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Novo Ticket | Versátil Tech</title>

  <!-- estilos do projeto -->
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/clientes.css" />
  <link rel="stylesheet" href="assets/css/ticket_formulario.css" />
<link rel="icon" type="image/png" href="assets/images/logo-versatil.png">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
<div class="app-container">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <a href="dashboard.html" class="sidebar-header">
      <img src="assets/images/logo-versatil.png" alt="Logo Versátil Tech" class="sidebar-logo" />
      <span class="sidebar-logo-text">Versátil Tech</span>
    </a>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-link"><i class="ph-fill ph-house"></i> <span>Dashboard</span></a>
      <a href="clientes.html" class="nav-link"><i class="ph-fill ph-users"></i> <span>Clientes</span></a>
      <a href="tickets.html" class="nav-link active"><i class="ph-fill ph-ticket"></i> <span>Tickets</span></a>
      <a href="usuarios.html" class="nav-link"><i class="ph-fill ph-user-list"></i> <span>Usuários</span></a>
      <a href="conhecimento.html" class="nav-link"><i class="ph-fill ph-books"></i> <span>Conhecimento</span></a>
    </nav>
  </aside>

  <div class="mobile-overlay" id="mobileOverlay"></div>

  <!-- Main -->
  <div class="main-content">
    <header class="navbar">
      <div class="navbar-left">
        <button class="mobile-menu-toggle" id="mobileMenuToggle"><i class="ph-fill ph-list"></i></button>
        <h1 class="navbar-title">Abrir / Editar Ticket</h1>
      </div>
      <div class="navbar-right">
        <div class="user-profile">
          <span id="currentUserName">[Nome]</span>
          <div class="user-avatar"><span>U</span></div>
        </div>
        <a href="index.html" class="logout-button" title="Sair"><i class="ph-fill ph-sign-out"></i></a>
      </div>
    </header>

    <main class="content-area">
      <form id="ticketForm" class="dense-form" novalidate>
        <div class="form-section">
          <div class="form-grid-cliente">

            <!-- Identificação -->
            <div class="form-group g-col-2">
              <label for="numeroTicket">Número do Ticket (SGA)</label>
              <input type="text" id="numeroTicket" placeholder="ex.: 1051" />
            </div>

            <div class="form-group g-col-5">
              <label for="clienteSearchInput">Cliente</label>
              <div class="searchable-select-container">
                <input type="text" id="clienteSearchInput" placeholder="Digite para buscar um cliente..." autocomplete="off" required />
                <input type="hidden" id="clienteIdInput" />
                <div class="search-results-list" id="searchResults"></div>
              </div>
            </div>

            <div class="form-group g-col-5">
              <label for="responsavel">Responsável</label>
              <input type="text" id="responsavel" value="[Nome do Usuário Logado]" readonly />
            </div>

            <!-- Status & Prioridade -->
            <div class="form-group g-col-3">
              <label for="statusTicket">Status do Ticket</label>
              <select id="statusTicket">
                <option>Aberto</option>
                <option>Em Andamento</option>
                <option>Em Análise com o Dev</option>
                <option>Aguardando Próxima Versão</option>
                <option>Concluído</option>
                <option>Aguardando Cliente</option>
                <option>Bloqueado</option>
              </select>
            </div>

            <div class="form-group g-col-3">
              <label for="prioridadeTicket">Prioridade</label>
              <select id="prioridadeTicket">
                <option>Baixa</option>
                <option>Média</option>
                <option>Alta</option>
                <option>Crítica</option>
              </select>
            </div>

            <div class="form-group g-col-6">
              <label for="linkSGA">Link (SGA)</label>
              <input type="url" id="linkSGA" placeholder="https://..." />
            </div>

            <!-- Notas do ticket -->
            <h4 class="form-row-label g-col-full">Notas do Ticket</h4>

            <div class="g-col-full">
              <div class="notes-card">

                <!-- nova nota -->
                <div class="note-new">
                  <div class="form-group">
                    <label for="noteText">Adicionar nota</label>
                    <textarea id="noteText" rows="3" placeholder="Descreva a atualização / interação..."></textarea>
                  </div>

                  <div class="note-attach-row">
                    <label class="btn btn-secondary note-attach-btn" for="noteImages">
                      <i class="ph ph-paperclip"></i> Anexar imagens
                    </label>
                    <input type="file" id="noteImages" accept="image/*" multiple hidden />
                    <div id="notePreviews" class="note-previews"></div>

                    <button type="button" id="addNoteBtn" class="btn btn-primary">
                      <i class="ph ph-plus-circle"></i> Incluir Nota
                    </button>
                  </div>
                </div>

                <!-- lista de notas -->
                <div id="notesList" class="notes-list empty">
                  <p class="empty-message">Nenhuma nota adicionada ainda.</p>
                </div>

              </div>
            </div>

          </div>
        </div>

        <div class="form-actions-footer">
          <a href="tickets.html" class="btn btn-secondary">Cancelar</a>
          <button type="button" id="saveTicketBtn" class="btn btn-primary">Salvar Alterações</button>
        </div>
      </form>
    </main>
  </div>
</div>

<!-- scripts -->
<script src="assets/js/main.js" defer></script>
<script src="assets/js/ticket_formulario.js" defer></script>
</body>
</html>
