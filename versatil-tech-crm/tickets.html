<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tickets | Versátil Tech</title>

  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/clientes.css" />
  <link rel="stylesheet" href="assets/css/tickets.css" />
<link rel="icon" type="image/png" href="assets/images/logo-versatil.png">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <a href="dashboard.html" class="sidebar-header">
        <img src="assets/images/logo-versatil.png" alt="Logo Versátil Tech" class="sidebar-logo" />
        <span class="sidebar-logo-text">Versátil Tech</span>
      </a>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link"><i class="ph-fill ph-house"></i> <span>Dashboard</span></a>
        <a href="clientes.html" class="nav-link"><i class="ph-fill ph-users"></i> <span>Clientes</span></a>
        <a href="tickets.html" class="nav-link active"><i class="ph-fill ph-ticket"></i> <span>Tickets</span></a>
        <a href="usuarios.html" class="nav-link"><i class="ph-fill ph-user-list"></i> <span>Usuários</span></a>
        <a href="conhecimento.html" class="nav-link"><i class="ph-fill ph-books"></i> <span>Conhecimento</span></a>
      </nav>
    </aside>

    <div class="mobile-overlay" id="mobileOverlay"></div>

    <div class="main-content">
      <header class="navbar">
        <div class="navbar-left">
          <button class="mobile-menu-toggle" id="mobileMenuToggle"><i class="ph-fill ph-list"></i></button>
          <h1 class="navbar-title">Tickets</h1>
        </div>
        <div class="navbar-right">
          <div class="user-profile"><span>[Nome]</span><div class="user-avatar"><span>U</span></div></div>
          <a href="index.html" class="logout-button" title="Sair"><i class="ph-fill ph-sign-out"></i></a>
        </div>
      </header>

      <main class="content-area">
        <!-- Toolbar -->
        <div class="tickets-toolbar">
          <div class="toolbar-left">
            <div class="search-input">
              <i class="ph ph-magnifying-glass"></i>
              <input id="filterTerm" type="search" placeholder="Buscar por ID, Cliente ou título..." />
            </div>
          </div>
          <div class="toolbar-right">
            <!-- Filtro Status -->
            <div class="dropdown">
              <button id="btnStatus" class="btn btn-filter">
                <i class="ph ph-faders"></i>
                <span data-label>Status: Todos</span>
                <i class="ph ph-caret-down"></i>
              </button>
              <div class="dropdown-menu" id="menuStatus" aria-labelledby="btnStatus">
                <button class="dropdown-item" data-value="">Todos Status</button>
                <button class="dropdown-item" data-value="Aberto">Aberto</button>
                <button class="dropdown-item" data-value="Em Análise com o Dev">Em Análise com o Dev</button>
                <button class="dropdown-item" data-value="Aguardando Próxima Versão">Aguardando Próxima Versão</button>
                <button class="dropdown-item" data-value="Aguardando Cliente">Aguardando Cliente</button>
                <button class="dropdown-item" data-value="Concluído">Concluído</button>
              </div>
            </div>

            <!-- Filtro Prioridade -->
            <div class="dropdown">
              <button id="btnPriority" class="btn btn-filter">
                <i class="ph ph-flag"></i>
                <span data-label>Prioridade: Todas</span>
                <i class="ph ph-caret-down"></i>
              </button>
              <div class="dropdown-menu" id="menuPriority" aria-labelledby="btnPriority">
                <button class="dropdown-item" data-value="">Todas Prioridades</button>
                <button class="dropdown-item" data-value="Baixa">Baixa</button>
                <button class="dropdown-item" data-value="Média">Média</button>
                <button class="dropdown-item" data-value="Alta">Alta</button>
                <button class="dropdown-item" data-value="Crítica">Crítica</button>
              </div>
            </div>

            <!-- Excel no padrão Clientes -->
            <button id="exportCsv" class="btn btn-excel">
              <i class="ph ph-microsoft-excel-logo"></i>
              Exportar p/ Excel
            </button>

            <a href="ticket_formulario.html" class="btn btn-primary">
              <i class="ph-fill ph-plus-circle"></i>
              Novo Ticket
            </a>
          </div>
        </div>

        <!-- Tabela -->
        <div class="card table-card">
          <div class="table-wrapper">
            <table class="data-table" id="ticketsTable">
              <thead>
                <tr>
                  <th style="width:34px;"><input type="checkbox" id="selectAll" /></th>
                  <th class="sortable" data-key="id">#</th>
                  <th class="sortable" data-key="titulo">Título</th>
                  <th class="sortable" data-key="cliente">Cliente</th>
                  <th class="sortable" data-key="prioridade">Prioridade</th>
                  <th class="sortable" data-key="status">Status</th>
                  <th class="sortable" data-key="responsavel">Responsável</th>
                  <th class="sortable" data-key="abertura">Data de Abertura</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="ticketsBody"><!-- via JS --></tbody>
            </table>
          </div>

          <div id="emptyState" class="empty-state" hidden>
            <p>Nenhum ticket encontrado.</p>
          </div>

          <div class="pagination-bar">
            <div class="pagination-info">
              <span id="rangeInfo">Mostrando 0–0</span> de <span id="totalInfo">0</span>
            </div>
            <nav class="pagination-nav" aria-label="Paginação de tickets">
              <button class="page-btn" id="prevPage" aria-label="Página anterior"><i class="ph ph-caret-left"></i></button>
              <div id="pagesContainer"></div>
              <button class="page-btn" id="nextPage" aria-label="Próxima página"><i class="ph ph-caret-right"></i></button>
            </nav>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="assets/js/main.js" defer></script>
  <script src="assets/js/tickets.js" defer></script>
</body>
</html>
